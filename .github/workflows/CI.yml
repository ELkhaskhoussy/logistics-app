name: Frontend CI Pipeline

on:
  push:
    branches:
      - develop
      - prod
  # Allows manual triggering from GitHub Actions UI:
  # GitHub → Actions → "Frontend CI Pipeline" → Run workflow
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'develop'
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sanitize Docker credentials
        run: |
          echo "Sanitizing username..."
          CLEAN_USER=$(echo "${{ secrets.DOCKER_USERNAME }}" | xargs)
          echo "CLEAN_USERNAME=$CLEAN_USER" >> $GITHUB_ENV

      # ── Determine the API URL based on the branch ──────────────────
      # develop → production backend (same as backend CI convention)
      # prod    → production backend
      - name: Set API URL for branch
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "API_URL=https://api.sendlo.fr" >> $GITHUB_ENV
            echo "APP_ENV=production" >> $GITHUB_ENV
          else
            echo "API_URL=https://api.sendlo.fr" >> $GITHUB_ENV
            echo "APP_ENV=development" >> $GITHUB_ENV
          fi

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Pass the API URL as a build arg so Expo bakes it into the bundle
          build-args: |
            API_URL=${{ env.API_URL }}
            APP_ENV=${{ env.APP_ENV }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          tags: |
            ${{ env.CLEAN_USERNAME }}/logistics-app-web:latest
            ${{ env.CLEAN_USERNAME }}/logistics-app-web:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/transportation-app || exit 1

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            docker compose -f docker-compose.prod.yml pull frontend
            docker compose -f docker-compose.prod.yml up -d frontend

            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
            docker image prune -f
