name: Frontend CI Pipeline

on:
  push:
    branches:
      - develop
      - prod
  # Allows manual triggering from GitHub Actions UI:
  # GitHub → Actions → "Frontend CI Pipeline" → Run workflow
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'develop'
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sanitize Docker credentials
        run: |
          echo "Sanitizing username..."
          CLEAN_USER=$(echo "${{ secrets.DOCKER_USERNAME }}" | xargs)
          echo "CLEAN_USERNAME=$CLEAN_USER" >> $GITHUB_ENV

      # ── Determine the API URL based on the branch ──────────────────
      # develop → production backend (same as backend CI convention)
      # prod    → production backend
      - name: Set API URL for branch
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "API_URL=/api" >> $GITHUB_ENV
            echo "APP_ENV=production" >> $GITHUB_ENV
          else
            echo "API_URL=/api" >> $GITHUB_ENV
            echo "APP_ENV=development" >> $GITHUB_ENV
          fi

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Pass the API URL as a build arg so Expo bakes it into the bundle
          build-args: |
            API_URL=${{ env.API_URL }}
            APP_ENV=${{ env.APP_ENV }}
          tags: |
            ${{ env.CLEAN_USERNAME }}/logistics-app-web:latest
            ${{ env.CLEAN_USERNAME }}/logistics-app-web:${{ github.sha }}
