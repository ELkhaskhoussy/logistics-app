server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression. This matters a lot: the Expo web bundle is ~3 MB of raw JS.
    # Uncompressed it downloads instantly on desktop Wi-Fi but frequently stalls
    # or aborts on mobile data, leaving the user staring at a blank page.
    # gzip_static alone was NOT enough — it only serves pre-compressed .gz files
    # if they already exist, and Expo's export does not produce them, so nothing
    # was ever compressed. gzip_static stays for the day we do pre-compress.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        text/javascript
        application/json
        text/css
        text/plain
        image/svg+xml
        application/manifest+json;

    # Cache static assets aggressively (JS/CSS bundles have content hashes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path → index.html
    # This prevents 404 errors when a user refreshes on a deep route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
